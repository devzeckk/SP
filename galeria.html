<aside class="photo-note" lang="en" aria-label="A note for you">
      <p>I love how we can talk for ages and, before I know it, so much time has gone by. Somewhere along the way, we find something else we have in common, and I always want to stay a little longer, talking to you.</p>
      <p>I really miss your affection. Sometimes I wish I could show you and tell you more clearly how much you mean to me (if you'd stop running away), but some things I'd rather show you in person.</p>
      <p>In the meantime, I'm leaving a little of that affection here, in the songs I picked. I may not always show it as much as I'd like to, but I want you to know: you are so loved by me.</p>
    </aside>
